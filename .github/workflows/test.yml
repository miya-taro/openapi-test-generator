name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    # 実バグに直結する項目（未使用/未定義変数、raise-from漏れ等）に絞ったLintと、
    # gui-tauri（フロントエンド）のロジック単体テスト。
    # Windows依存が無いため、高速な ubuntu-latest で実行する。
    name: Lint (ruff / eslint / clippy) & GUI unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff (Python)
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui-tauri/package-lock.json

      - name: Install gui-tauri dependencies
        run: npm ci
        working-directory: gui-tauri

      - name: Run eslint (gui-tauri/src)
        run: npm run lint
        working-directory: gui-tauri

      - name: Run gui-tauri unit tests (vitest)
        run: npm test
        working-directory: gui-tauri

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-tauri/src-tauri

      - name: Run clippy (gui-tauri/src-tauri)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: gui-tauri/src-tauri

  test:
    # os.startfile など、このツールセットはWindows専用の前提で作られているため
    # windows-latest で実行する。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate runner test fixtures
        # sample.xlsx は *.xlsx として gitignore されているため、テスト前に生成する
        run: python runner/tests/make_fixture.py

      - name: Run generator tests (src/)
        run: python -m pytest tests/ -v

      - name: Run runner tests
        run: python -m pytest runner/tests/ -v

      - name: Run GUI logic tests
        run: python -m pytest gui/tests/ -v

  e2e:
    # このツールセット自体の単体テストだけでなく、docs/ のサンプル一式
    # （openapi.json / mock_api.py / scenarios.yaml）を使って「生成 → 実際のAPIサーバーへの
    # HTTP実行 → 結果Excel出力」（Layer 1）と「DB事前状態確認込みのシナリオ実行」（Layer 2）
    # を実際にエンドツーエンドで検証する。詳細は docs/run_e2e.py を参照。
    name: E2E (docs/ sample against mock API + PostgreSQL)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r docs/requirements-mock.txt
          pip install -r docs/requirements-schemathesis.txt

      - name: Start PostgreSQL
        # windows-latest ランナーの GitHub Actions `services:` コンテナは Linux 専用で
        # 使えないため、Docker Desktop（windows-latest に標準搭載、既定で Linux コンテナ
        # モード）に対して docker run を直接叩く形で代用する。
        run: >
          docker run -d --name apitester-pg
          -e POSTGRES_PASSWORD=testpass123
          -e POSTGRES_DB=apitester_test
          -e POSTGRES_USER=postgres
          -p 5432:5432
          postgres:16

      - name: Apply DB schema
        run: python docs/apply_schema.py

      - name: Run E2E (generate -> execute -> DB scenario verification)
        run: python docs/run_e2e.py --reset-db-between-layers

      - name: Run schemathesis (契約層の探索的ファジング。決定論的スイートとは別レーン、失敗してもブロックしない)
        run: python docs/run_schemathesis.py

      - name: Upload schemathesis evidence (JUnit XML / cassette)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: |
            docs/_ci_schemathesis_result.xml
            docs/_ci_schemathesis_cassette.yaml
          if-no-files-found: ignore

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f apitester-pg
