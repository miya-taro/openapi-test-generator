name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    # 実バグに直結する項目（未使用/未定義変数、raise-from漏れ等）に絞ったLintと、
    # gui-tauri（フロントエンド）のロジック単体テスト。
    # Windows依存が無いため、高速な ubuntu-latest で実行する。
    name: Lint (ruff / eslint) & GUI unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff (Python)
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui-tauri/package-lock.json

      - name: Install gui-tauri dependencies
        run: npm ci
        working-directory: gui-tauri

      - name: Run eslint (gui-tauri/src)
        run: npm run lint
        working-directory: gui-tauri

      - name: Run gui-tauri unit tests (vitest)
        run: npm test
        working-directory: gui-tauri

  test:
    # os.startfile など、このツールセットはWindows専用の前提で作られているため
    # windows-latest で実行する。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate runner test fixtures
        # sample.xlsx は *.xlsx として gitignore されているため、テスト前に生成する
        run: python runner/tests/make_fixture.py

      - name: Run generator tests (src/)
        run: python -m pytest tests/ -v

      - name: Run runner tests
        run: python -m pytest runner/tests/ -v --junitxml=runner-test-results.xml

      - name: Annotate runner failures
        if: failure()
        shell: python
        run: |
          import pathlib
          import xml.etree.ElementTree as ET
          path = pathlib.Path('runner-test-results.xml')
          if path.is_file():
              for case in ET.parse(path).getroot().iter('testcase'):
                  for tag in ('failure', 'error'):
                      failure = case.find(tag)
                      if failure is not None:
                          message = f"{case.get('classname')}.{case.get('name')}: {failure.get('message', '')}"
                          message = message[:3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          # Windows stdout may be cp1252; preserve every error as ASCII escapes.
                          message = message.encode('ascii', 'backslashreplace').decode('ascii')
                          print(f'::error title=Runner test failure::{message}')

      - name: Run GUI logic tests
        run: python -m pytest gui/tests/ -v

      - name: Run workflow tests
        run: python -m pytest workflow/tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Windows clone startup and repeat startup
        shell: cmd
        run: |
          call run-windows.bat -SmokeTest
          if errorlevel 1 exit /b 1
          runner\.venv\Scripts\python.exe -m pip install exrex==0.12.0
          if errorlevel 1 exit /b 1
          echo previous-runtime>runner\.venv\.runtime-requirements.sha256
          call run-windows.bat -SmokeTest
          if errorlevel 1 exit /b 1
          runner\.venv\Scripts\python.exe -c "import importlib.util, rstr; assert importlib.util.find_spec('exrex') is None"
          if errorlevel 1 exit /b 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-tauri/src-tauri

      - name: Run clippy (gui-tauri/src-tauri)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: gui-tauri/src-tauri

  e2e:
    # docs/ のサンプルAPIとPostgreSQLを使い、契約試験とDBシナリオを検証する。
    name: E2E (HTTP / PostgreSQL / InfluxDB / browser)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: apitester_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apitester_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      influxdb:
        image: influxdb:1.8.10
        ports:
          - 8086:8086
        options: >-
          --health-cmd "curl -f http://localhost:8086/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r docs/requirements-mock.txt
          pip install -r docs/requirements-schemathesis.txt

      - name: Apply DB schema
        run: python docs/apply_schema.py

      - name: Run E2E (generate -> execute -> DB scenario verification)
        run: python docs/run_e2e.py --reset-db-between-layers

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify GET JSON body mappings against real HTTP and PostgreSQL
        env:
          OTG_INTEGRATION_DB_CONFIG: '{"host":"127.0.0.1","port":5432,"dbname":"apitester_test","user":"postgres","password":"testpass123"}'
          OTG_MEASURE_EVIDENCE_DIR: docs/_ci_measure_evidence
          OTG_SIDE_EFFECT_EVIDENCE_DIR: docs/_ci_measure_evidence/side-effects
          OTG_CONTRACT_DB_EVIDENCE_DIR: docs/_ci_measure_evidence/contract-errors
        run: python -m pytest runner/tests/test_measure_get_e2e.py runner/tests/test_db_scenario_e2e.py runner/tests/test_comparison_unchanged_e2e.py runner/tests/test_contract_db_guard_e2e.py -q -s

      - name: Verify InfluxDB UI mappings and generated error guards
        env:
          OTG_INFLUX_INTEGRATION_CONFIG: '{"host":"127.0.0.1","port":8086}'
          OTG_INFLUX_EVIDENCE_DIR: docs/_ci_measure_evidence/influxdb
        run: python -m pytest runner/tests/test_influx_response_e2e.py runner/tests/test_influx_mutation_e2e.py -q

      - name: Verify common rule cases, fixture cleanup and faulty APIs
        env:
          OTG_INTEGRATION_DB_CONFIG: '{"host":"127.0.0.1","port":5432,"dbname":"apitester_test","user":"postgres","password":"testpass123"}'
          OTG_INFLUX_INTEGRATION_CONFIG: '{"host":"127.0.0.1","port":8086}'
          OTG_RULE_EVIDENCE_DIR: docs/_ci_measure_evidence/rules
        run: python -m pytest runner/tests/test_rule_cases.py -q

      - name: Verify cross-database lookup mappings and faulty APIs
        env:
          OTG_INTEGRATION_DB_CONFIG: '{"host":"127.0.0.1","port":5432,"dbname":"apitester_test","user":"postgres","password":"testpass123"}'
          OTG_INFLUX_INTEGRATION_CONFIG: '{"host":"127.0.0.1","port":8086}'
          OTG_LOOKUP_EVIDENCE_DIR: docs/_ci_measure_evidence/lookups
        run: python -m pytest runner/tests/test_lookup_response_e2e.py -q

      - name: Verify POST array mappings and faulty PostgreSQL APIs
        env:
          OTG_INTEGRATION_DB_CONFIG: '{"host":"127.0.0.1","port":5432,"dbname":"apitester_test","user":"postgres","password":"testpass123"}'
          OTG_POST_EVIDENCE_DIR: docs/_ci_measure_evidence/post-array
          OTG_PWRCO_EVIDENCE_DIR: docs/_ci_measure_evidence/pwrco
          OTG_THREE_AUTH_EVIDENCE_DIR: docs/_ci_measure_evidence/three-api-auth
          OTG_SQL_EVIDENCE_DIR: docs/_ci_measure_evidence/sql-response
          OTG_PLAN_COVERAGE_EVIDENCE_DIR: docs/_ci_measure_evidence/plan-coverage
        run: python -m pytest runner/tests/test_post_array_e2e.py runner/tests/test_sql_response_e2e.py runner/tests/test_pwrco_e2e.py runner/tests/test_three_api_auth_e2e.py runner/tests/test_plan_coverage_e2e.py runner/tests/test_pytest_db_integration.py runner/tests/test_api_flow.py -q

      - name: Upload GET JSON body comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-get-evidence
          path: docs/_ci_measure_evidence/
          if-no-files-found: error

      - name: Build browser UI and install browser test driver
        run: |
          npm ci --prefix gui-tauri
          npm run build --prefix gui-tauri
          pip install -r requirements-browser-test.txt
          python -m playwright install --with-deps chromium

      - name: Verify independent API matrix and actual browser workflow
        env:
          OTG_BROWSER_TEST: "1"
          OTG_INTEGRATION_DB_CONFIG: '{"host":"127.0.0.1","port":5432,"dbname":"apitester_test","user":"postgres","password":"testpass123"}'
          OTG_INFLUX_INTEGRATION_CONFIG: '{"host":"127.0.0.1","port":8086}'
          OTG_BROWSER_EVIDENCE_DIR: docs/_ci_release_evidence/browser
          OTG_RELEASE_EVIDENCE_DIR: docs/_ci_release_evidence/api
          OTG_LOGIN_EVIDENCE_DIR: docs/_ci_release_evidence/login
        run: python -m pytest runner/tests/test_release_candidate_matrix.py runner/tests/test_login_e2e.py gui/tests/test_browser_workflow_e2e.py gui/tests/test_browser_api_flow.py gui/tests/test_browser_influx_config.py gui/tests/test_browser_influx_mutation.py gui/tests/test_browser_post_array.py gui/tests/test_browser_sql_response.py gui/tests/test_browser_pwrco.py gui/tests/test_browser_login.py gui/tests/test_browser_create_api.py gui/tests/test_browser_settings_recovery.py gui/tests/test_browser_rule_cases.py gui/tests/test_browser_db_wizard.py workflow/tests/test_html_report.py -q

      - name: Upload first release qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-release-evidence
          path: docs/_ci_release_evidence/
          if-no-files-found: error

      - name: Run schemathesis (契約層の探索的ファジング。決定論的スイートとは別レーン、失敗してもブロックしない)
        run: python docs/run_schemathesis.py

      - name: Upload schemathesis evidence (JUnit XML / cassette)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: |
            docs/_ci_schemathesis_result.xml
            docs/_ci_schemathesis_cassette.yaml
          if-no-files-found: ignore
