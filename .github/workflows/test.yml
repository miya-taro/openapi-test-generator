name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    # 実バグに直結する項目（未使用/未定義変数、raise-from漏れ等）に絞ったLintと、
    # gui-tauri（フロントエンド）のロジック単体テスト。
    # Windows依存が無いため、高速な ubuntu-latest で実行する。
    name: Lint (ruff / eslint) & GUI unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff (Python)
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui-tauri/package-lock.json

      - name: Install gui-tauri dependencies
        run: npm ci
        working-directory: gui-tauri

      - name: Run eslint (gui-tauri/src)
        run: npm run lint
        working-directory: gui-tauri

      - name: Run gui-tauri unit tests (vitest)
        run: npm test
        working-directory: gui-tauri

  test:
    # os.startfile など、このツールセットはWindows専用の前提で作られているため
    # windows-latest で実行する。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate runner test fixtures
        # sample.xlsx は *.xlsx として gitignore されているため、テスト前に生成する
        run: python runner/tests/make_fixture.py

      - name: Run generator tests (src/)
        run: python -m pytest tests/ -v

      - name: Run runner tests
        run: python -m pytest runner/tests/ -v

      - name: Run GUI logic tests
        run: python -m pytest gui/tests/ -v

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-tauri/src-tauri

      - name: Run clippy (gui-tauri/src-tauri)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: gui-tauri/src-tauri

  e2e:
    # docs/ のサンプルAPIとPostgreSQLを使い、契約試験とDBシナリオを検証する。
    name: E2E (docs/ sample against mock API + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: apitester_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apitester_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r docs/requirements-mock.txt
          pip install -r docs/requirements-schemathesis.txt

      - name: Apply DB schema
        run: python docs/apply_schema.py

      - name: Run E2E (generate -> execute -> DB scenario verification)
        run: python docs/run_e2e.py --reset-db-between-layers

      - name: Run schemathesis (契約層の探索的ファジング。決定論的スイートとは別レーン、失敗してもブロックしない)
        run: python docs/run_schemathesis.py

      - name: Upload schemathesis evidence (JUnit XML / cassette)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: |
            docs/_ci_schemathesis_result.xml
            docs/_ci_schemathesis_cassette.yaml
          if-no-files-found: ignore
