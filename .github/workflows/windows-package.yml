name: Windows application package

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-not-configured:
    if: ${{ vars.WINDOWS_SIGNING_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why packaging was skipped
        run: |
          echo "Windows packaging was skipped because a trusted code-signing certificate is not configured."
          echo "See README.md for the required GitHub Actions variable and secrets."

  package:
    if: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            docs/requirements-schemathesis.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-tauri/src-tauri

      - name: Import code-signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64)) {
            throw "Missing repository secret WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Missing repository secret WINDOWS_SIGNING_CERTIFICATE_PASSWORD."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "openapi-test-tool-codesign.pfx"
          try {
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64)
            [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object { $_.HasPrivateKey } |
              Select-Object -First 1
            if (-not $certificate -or -not $certificate.HasPrivateKey) {
              throw "The imported code-signing certificate has no private key."
            }
            $codeSigningEku = $certificate.Extensions |
              Where-Object { $_.Oid.Value -eq "2.5.29.37" } |
              ForEach-Object { $_.EnhancedKeyUsages } |
              Where-Object { $_.Value -eq "1.3.6.1.5.5.7.3.3" }
            if (-not $codeSigningEku) {
              throw "The certificate is not valid for code signing."
            }
            "WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Install portable Python dependencies
        run: python -m pip install -r requirements-runtime.txt -r docs/requirements-schemathesis.txt packaging

      - name: Install frontend dependencies
        run: npm ci
        working-directory: gui-tauri

      - name: Fetch locked Rust dependencies for offline packaging
        run: cargo fetch --locked --manifest-path gui-tauri/src-tauri/Cargo.toml

      - name: Build portable application and installers
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-portable.ps1
        env:
          WINDOWS_REQUIRE_SIGNING: "true"

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openapi-test-tool-windows
          path: |
            dist/openapi-test-tool-portable/**
            dist/openapi-test-tool-installers/**
          if-no-files-found: error
          retention-days: 14
