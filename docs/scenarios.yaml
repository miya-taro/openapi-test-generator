# 自動生成された叩き台（generate_db_scenarios.py）を、実際の動作確認のために手直ししたものです。
# 直した内容は下記コメント、および直近のコミット・チャットの説明を参照してください。
#
# 元の自動生成の癖（他のAPIで同じツールを使う際にも起こりうる）:
# - login/logoutのようなDBを変更しない操作にも db_check が生成される
#   （POST/PUT/PATCH/DELETEを一律「データ変更あり」とみなすため）
# - APIのキャメルケース（categoryId等）がDBカラム名（category_id等）と食い違う場合、
#   db_check にはAPI側の名前がそのまま使われる（自動では対応表に無い変換はできない）
# - order_itemsとcart_itemsのようにカラム構成が同じテーブルは、名前だけでは一意に
#   決められない（mapping.yamlの「次点候補と僅差」コメントが出ている箇所は要注意）
# - create→update→deleteを個々のリソースごとに並べると、他のリソースが参照する前に
#   削除してしまいFK違反になることがある（例: 注文で使うユーザーを先に消してしまう）

scenarios:
  defaults:
    engine: postgres
  list:
  - name: createCategory
    request:
      operationId: createCategory
      body:
        name: a
    db_check:
      table: categories
      where:
        name: a
      expect:
        exists: true
        columns:
          name: a

  - name: createUser
    request:
      operationId: createUser
      body:
        name: a
        email: test@example.com
        role: member
    db_check:
      table: users
      where:
        name: a
        email: test@example.com
        role: member
      expect:
        exists: true
        columns:
          name: a
          email: test@example.com
          role: member

  - name: createProduct
    request:
      operationId: createProduct
      body:
        name: a
        description: test
        price: 0
        categoryId: 1
        status: draft
    db_check:
      table: products
      where:
        name: a
        category_id: 1
      expect:
        exists: true
        columns:
          name: a
          price: 0
          category_id: 1
          status: draft

  - name: createOrder
    request:
      operationId: createOrder
      body:
        userId: 1
        items:
        - productId: 1
          quantity: 1
    db_check:
      table: orders
      where:
        user_id: 1
      expect:
        exists: true
        columns:
          user_id: 1
          status: pending

  - name: createReview
    request:
      operationId: createReview
      body:
        productId: 1
        rating: 5
        comment: test
    db_check:
      table: reviews
      where:
        product_id: 1
        rating: 5
      expect:
        exists: true
        columns:
          product_id: 1
          rating: 5
          comment: test

  - name: addCartItem
    request:
      operationId: addCartItem
      body:
        productId: 1
        quantity: 1
    db_check:
      table: cart_items
      where:
        product_id: 1
        quantity: 1
      expect:
        exists: true
        columns:
          product_id: 1
          quantity: 1

  - name: updateUser
    request:
      operationId: updateUser
      path_params:
        userId: 1
      body:
        name: b
        role: member
    db_check:
      table: users
      where:
        id: 1
      expect:
        exists: true
        columns:
          name: b

  - name: updateCategory
    request:
      operationId: updateCategory
      path_params:
        categoryId: 1
      body:
        name: b
    db_check:
      table: categories
      where:
        id: 1
      expect:
        exists: true
        columns:
          name: b

  - name: updateProduct
    request:
      operationId: updateProduct
      path_params:
        productId: 1
      body:
        name: b
        price: 100
        status: published
    db_check:
      table: products
      where:
        id: 1
      expect:
        exists: true
        columns:
          name: b
          price: 100
          status: published

  - name: updateOrderStatus
    request:
      operationId: updateOrderStatus
      path_params:
        orderId: 1
      body:
        status: shipped
    db_check:
      table: orders
      where:
        id: 1
      expect:
        exists: true
        columns:
          status: shipped

  # mapping.yamlの叩き台では「次点候補と僅差」により cart_items に誤って
  # マッピングされていたため、正しい order_items に修正している。
  - name: addOrderItem
    request:
      operationId: addOrderItem
      path_params:
        orderId: 1
      body:
        productId: 1
        quantity: 2
    db_check:
      table: order_items
      where:
        order_id: 1
        product_id: 1
        quantity: 2
      expect:
        exists: true
        columns:
          product_id: 1
          quantity: 2

  - name: updateCartItem
    request:
      operationId: updateCartItem
      path_params:
        itemId: 1
      body:
        quantity: 3
    db_check:
      table: cart_items
      where:
        id: 1
      expect:
        exists: true
        columns:
          quantity: 3

  # cancelOrderはDELETEメソッドだが、実際には論理キャンセル（statusの更新）であり
  # 行自体は削除されない。自動生成は「DELETE=行が無くなる」前提だったため、
  # 実際の実装（status確認）に合わせて修正している。
  - name: cancelOrder
    request:
      operationId: cancelOrder
      path_params:
        orderId: 1
    db_check:
      table: orders
      where:
        id: 1
      expect:
        exists: true
        columns:
          status: cancelled

  - name: removeCartItem
    request:
      operationId: removeCartItem
      path_params:
        itemId: 1
    db_check:
      table: cart_items
      where:
        id: 1
      expect:
        exists: false

  - name: deleteReview
    request:
      operationId: deleteReview
      path_params:
        reviewId: 1
    db_check:
      table: reviews
      where:
        id: 1
      expect:
        exists: false

  # GET はDBに事前データを作成し、レスポンスがそのDB行を返すことと、
  # GET後もDB行が変化していないことを両方確認する。
  - name: getUser
    given:
    - table: users
      as: user
      fields:
        name: get_user
        email: get-user-db@example.com
        role: member
    request:
      operationId: getUser
      path_params:
        userId: "{{given.user.id}}"
    response_check:
      expect:
        status: 200
        body:
          id: "{{given.user.id}}"
          name: "{{given.user.name}}"
          email: "{{given.user.email}}"
          role: "{{given.user.role}}"
    db_check:
      table: users
      where:
        id: "{{given.user.id}}"
      expect:
        exists: true
        columns:
          name: "{{given.user.name}}"
          email: "{{given.user.email}}"
          role: "{{given.user.role}}"

  - name: listUsers
    given:
    - table: users
      as: user
      fields:
        name: list_users
        email: list-users-db@example.com
        role: member
    request:
      operationId: listUsers
    response_check:
      expect:
        status: 200
        contains:
        - path: "$"
          fields:
            id: "{{given.user.id}}"
            name: "{{given.user.name}}"
            email: "{{given.user.email}}"
            role: "{{given.user.role}}"
    db_check:
      table: users
      where:
        id: "{{given.user.id}}"
      expect:
        exists: true
        columns:
          name: "{{given.user.name}}"
          email: "{{given.user.email}}"
          role: "{{given.user.role}}"

  - name: listUserOrders
    given:
    - table: users
      as: user
      fields:
        name: list_user_orders
        email: list-user-orders-db@example.com
        role: member
    - table: orders
      as: order
      fields:
        user_id: "{{given.user.id}}"
        status: pending
    request:
      operationId: listUserOrders
      path_params:
        userId: "{{given.user.id}}"
    response_check:
      expect:
        status: 200
        contains:
        - path: "$"
          fields:
            id: "{{given.order.id}}"
            user_id: "{{given.user.id}}"
            status: "{{given.order.status}}"
    db_check:
      table: orders
      where:
        id: "{{given.order.id}}"
      expect:
        exists: true
        columns:
          user_id: "{{given.user.id}}"
          status: "{{given.order.status}}"

  - name: listCategories
    given:
    - table: categories
      as: category
      fields:
        name: list_categories
    request:
      operationId: listCategories
    response_check:
      expect:
        status: 200
        contains:
        - path: "$"
          fields:
            id: "{{given.category.id}}"
            name: "{{given.category.name}}"
    db_check:
      table: categories
      where:
        id: "{{given.category.id}}"
      expect:
        exists: true
        columns:
          name: "{{given.category.name}}"

  - name: getCategory
    given:
    - table: categories
      as: category
      fields:
        name: get_category
    request:
      operationId: getCategory
      path_params:
        categoryId: "{{given.category.id}}"
    response_check:
      expect:
        status: 200
        body:
          id: "{{given.category.id}}"
          name: "{{given.category.name}}"
    db_check:
      table: categories
      where:
        id: "{{given.category.id}}"
      expect:
        exists: true
        columns:
          name: "{{given.category.name}}"

  - name: listProducts
    given:
    - table: categories
      as: category
      fields:
        name: list_products_category
    - table: products
      as: product
      fields:
        name: list_products
        description: list_products_db
        price: 17.25
        category_id: "{{given.category.id}}"
        status: draft
    request:
      operationId: listProducts
    response_check:
      expect:
        status: 200
        contains:
        - path: "$"
          fields:
            id: "{{given.product.id}}"
            name: "{{given.product.name}}"
            description: "{{given.product.description}}"
            price: 17.25
            category_id: "{{given.category.id}}"
            status: "{{given.product.status}}"
    db_check:
      table: products
      where:
        id: "{{given.product.id}}"
      expect:
        exists: true
        columns:
          name: "{{given.product.name}}"
          description: "{{given.product.description}}"
          price: 17.25
          category_id: "{{given.category.id}}"
          status: "{{given.product.status}}"

  - name: getProduct
    given:
    - table: categories
      as: category
      fields:
        name: get_product_category
    - table: products
      as: product
      fields:
        name: get_product
        description: get_product_db
        price: 23.5
        category_id: "{{given.category.id}}"
        status: published
    request:
      operationId: getProduct
      path_params:
        productId: "{{given.product.id}}"
    response_check:
      expect:
        status: 200
        body:
          id: "{{given.product.id}}"
          name: "{{given.product.name}}"
          description: "{{given.product.description}}"
          price: 23.5
          category_id: "{{given.category.id}}"
          status: "{{given.product.status}}"
    db_check:
      table: products
      where:
        id: "{{given.product.id}}"
      expect:
        exists: true
        columns:
          name: "{{given.product.name}}"
          description: "{{given.product.description}}"
          price: 23.5
          category_id: "{{given.category.id}}"
          status: "{{given.product.status}}"

  - name: listOrders
    given:
    - table: users
      as: user
      fields:
        name: list_orders
        email: list-orders-db@example.com
        role: member
    - table: orders
      as: order
      fields:
        user_id: "{{given.user.id}}"
        status: delivered
    request:
      operationId: listOrders
    response_check:
      expect:
        status: 200
        contains:
        - path: "$"
          fields:
            id: "{{given.order.id}}"
            user_id: "{{given.user.id}}"
            status: "{{given.order.status}}"
    db_check:
      table: orders
      where:
        id: "{{given.order.id}}"
      expect:
        exists: true
        columns:
          user_id: "{{given.user.id}}"
          status: "{{given.order.status}}"

  - name: getOrder
    given:
    - table: users
      as: user
      fields:
        name: get_order
        email: get-order-db@example.com
        role: member
    - table: orders
      as: order
      fields:
        user_id: "{{given.user.id}}"
        status: shipped
    request:
      operationId: getOrder
      path_params:
        orderId: "{{given.order.id}}"
    response_check:
      expect:
        status: 200
        body:
          id: "{{given.order.id}}"
          user_id: "{{given.user.id}}"
          status: "{{given.order.status}}"
    db_check:
      table: orders
      where:
        id: "{{given.order.id}}"
      expect:
        exists: true
        columns:
          user_id: "{{given.user.id}}"
          status: "{{given.order.status}}"

  - name: listOrderItems
    given:
    - table: users
      as: user
      fields:
        name: list_order_items
        email: list-order-items-db@example.com
        role: member
    - table: products
      as: product
      fields:
        name: list_order_items_product
        price: 12.5
    - table: orders
      as: order
      fields:
        user_id: "{{given.user.id}}"
        status: pending
    - table: order_items
      as: order_item
      fields:
        order_id: "{{given.order.id}}"
        product_id: "{{given.product.id}}"
        quantity: 4
    request:
      operationId: listOrderItems
      path_params:
        orderId: "{{given.order.id}}"
    response_check:
      expect:
        status: 200
        contains:
        - path: "$"
          fields:
            id: "{{given.order_item.id}}"
            order_id: "{{given.order.id}}"
            product_id: "{{given.product.id}}"
            quantity: "{{given.order_item.quantity}}"
    db_check:
      table: order_items
      where:
        id: "{{given.order_item.id}}"
      expect:
        exists: true
        columns:
          order_id: "{{given.order.id}}"
          product_id: "{{given.product.id}}"
          quantity: "{{given.order_item.quantity}}"

  - name: listReviews
    given:
    - table: products
      as: product
      fields:
        name: list_reviews_product
        price: 5.75
    - table: reviews
      as: review
      fields:
        product_id: "{{given.product.id}}"
        rating: 4
        comment: list_reviews_db
    request:
      operationId: listReviews
    response_check:
      expect:
        status: 200
        contains:
        - path: "$"
          fields:
            id: "{{given.review.id}}"
            product_id: "{{given.product.id}}"
            rating: "{{given.review.rating}}"
            comment: "{{given.review.comment}}"
    db_check:
      table: reviews
      where:
        id: "{{given.review.id}}"
      expect:
        exists: true
        columns:
          product_id: "{{given.product.id}}"
          rating: "{{given.review.rating}}"
          comment: "{{given.review.comment}}"

  - name: getReview
    given:
    - table: products
      as: product
      fields:
        name: get_review_product
        price: 7.5
    - table: reviews
      as: review
      fields:
        product_id: "{{given.product.id}}"
        rating: 5
        comment: get_review_db
    request:
      operationId: getReview
      path_params:
        reviewId: "{{given.review.id}}"
    response_check:
      expect:
        status: 200
        body:
          id: "{{given.review.id}}"
          product_id: "{{given.product.id}}"
          rating: "{{given.review.rating}}"
          comment: "{{given.review.comment}}"
    db_check:
      table: reviews
      where:
        id: "{{given.review.id}}"
      expect:
        exists: true
        columns:
          product_id: "{{given.product.id}}"
          rating: "{{given.review.rating}}"
          comment: "{{given.review.comment}}"

  - name: getCart
    given:
    - table: products
      as: product
      fields:
        name: get_cart_product
        price: 8.25
    - table: cart_items
      as: cart_item
      fields:
        product_id: "{{given.product.id}}"
        quantity: 6
    request:
      operationId: getCart
    response_check:
      expect:
        status: 200
        contains:
        - path: items
          fields:
            id: "{{given.cart_item.id}}"
            product_id: "{{given.product.id}}"
            quantity: "{{given.cart_item.quantity}}"
    db_check:
      table: cart_items
      where:
        id: "{{given.cart_item.id}}"
      expect:
        exists: true
        columns:
          product_id: "{{given.product.id}}"
          quantity: "{{given.cart_item.quantity}}"

  # 共有データを削除すると外部キー制約に当たるため、deleteUser/category/product は
  # 各シナリオ専用の未参照行を given で作って削除し、DBから消えたことを確認する。

  - name: deleteUser
    given:
    - table: users
      as: user
      fields:
        name: delete_user
        email: delete-user-db@example.com
        role: member
    request:
      operationId: deleteUser
      path_params:
        userId: "{{given.user.id}}"
    response_check:
      expect:
        status: 200
    db_check:
      table: users
      where:
        id: "{{given.user.id}}"
      expect:
        exists: false

  - name: deleteCategory
    given:
    - table: categories
      as: category
      fields:
        name: delete_category
    request:
      operationId: deleteCategory
      path_params:
        categoryId: "{{given.category.id}}"
    response_check:
      expect:
        status: 200
    db_check:
      table: categories
      where:
        id: "{{given.category.id}}"
      expect:
        exists: false

  - name: deleteProduct
    given:
    - table: products
      as: product
      fields:
        name: delete_product
        price: 3.5
        status: draft
    request:
      operationId: deleteProduct
      path_params:
        productId: "{{given.product.id}}"
    response_check:
      expect:
        status: 200
    db_check:
      table: products
      where:
        id: "{{given.product.id}}"
      expect:
        exists: false
