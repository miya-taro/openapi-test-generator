# Disposable local databases only; never use these credentials for real systems.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: otg_lab
      POSTGRES_USER: otg_lab
      POSTGRES_PASSWORD: lab-only-password
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U otg_lab -d otg_lab']
      interval: 2s
      timeout: 3s
      retries: 30
  influxdb:
    image: influxdb:1.8.10
    ports:
      - '127.0.0.1:18086:8086'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8086/ping']
      interval: 2s
      timeout: 3s
      retries: 30
