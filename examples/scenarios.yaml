# DBシナリオ定義。db_scenario_runner.py が上から順に実行する。
# examples/openapi.json（Example Shop API）+ examples/mapping.yaml から
# generate_db_scenarios.py で自動生成した叩き台をもとに、期待値を確認・手直ししたもの。
#
# 実行例:
#   python runner/db_scenario_runner.py examples/scenarios.yaml examples/openapi.json \
#     --base-url http://localhost:8080 --config examples/config.json \
#     --auth-config examples/auth_config.yaml --dry-run

scenarios:
  defaults:
    engine: postgres   # このファイルのシナリオはほとんどpostgresなので既定値にしている

  list:
    - name: ユーザー作成でusersテーブルに1行増える（複数カラムの確認例）
      # POST /users （examples/openapi.json 参照）
      request:
        operationId: createUser
        body: { name: "太郎", email: "taro@example.com" }
      db_check:
        table: users
        where: { email: "taro@example.com" }
        expect:
          exists: true
          # columns には複数のカラムをまとめて書ける（辞書なので何個でも追加可能）
          columns:
            name: "太郎"
            email: "taro@example.com"

    - name: 作成したユーザーを更新する（前のシナリオのレスポンスから id を引き継ぐ）
      # PUT /users/{id}
      request:
        operationId: updateUser
        path_params: { id: "{{response.id}}" }
        body: { name: "次郎" }
      db_check:
        table: users
        where: { id: "{{response.id}}" }
        expect:
          columns: { name: "次郎" }

    - name: ユーザー削除で行が消える
      # DELETE /users/{id}
      request:
        operationId: deleteUser
        path_params: { id: "{{response.id}}" }
      db_check:
        table: users
        where: { id: "{{response.id}}" }
        expect:
          exists: false

    - name: 注文作成でordersテーブルに1行増える（複数カラムの確認例）
      # POST /orders
      request:
        operationId: createOrder
        body:
          user_id: 1
          status: pending
          items:
            - { product_name: "ダミー商品", quantity: 2, price: 500 }
      db_check:
        table: orders
        where: { user_id: 1, status: pending }
        expect:
          exists: true
          # 送信した user_id・status の両方が正しくDBに反映されているかを1つのシナリオで確認する
          columns:
            user_id: 1
            status: pending

    - name: 注文作成でorder_linesテーブルにも明細行が増える（親子テーブル・複数カラムの確認例）
      # POST /orders （上のシナリオと同じエンドポイント。DB側で見るテーブルが違うだけ）
      # order_lines は orders への外部キー（order_id）を持つ子テーブルなので、
      # generate_db_scenarios.py の自動生成では対応できない（mapping.yaml のコメント参照）。
      # このシナリオは手動で追加したもの。直前のcreateOrderシナリオのレスポンスIDを
      # order_id として使い、明細行が正しい内容で作成されたことを確認する。
      request:
        operationId: createOrder
        body:
          user_id: 1
          status: pending
          items:
            - { product_name: "ダミー商品2", quantity: 3, price: 750 }
      db_check:
        table: order_lines
        where: { order_id: "{{response.id}}" }
        expect:
          exists: true
          columns:
            product_name: "ダミー商品2"
            quantity: 3
            price: 750

    - name: DBに仕込んだ高額な注文を取得すると正しい金額が返る（response_checkの例）
      # GET /orders/{id}
      # db_checkはAPI呼び出し「後」のDB変化を確認する仕組みなので、この逆
      # （DBに事前に仕込んだ極端な値をAPI経由で正しく読み出せるか）は確認できない。
      # そのためresponse_checkを使う。examples/setup.sqlで id=999 に高額商品(99999999.99)を
      # あらかじめ仕込んである。ドット区切りで配列要素にも辿れる（items.0.price）。
      request:
        operationId: getOrder
        path_params: { id: 999 }
      response_check:
        expect:
          status: 200
          body:
            id: 999
            items.0.price: 99999999.99

    - name: センサーデータ送信でInfluxDBにポイントが書き込まれる
      # POST /sensor-data
      request:
        operationId: postSensorData
        body: { device_id: "abc123", temperature: 23.5 }
      db_check:
        engine: influxdb   # defaults(postgres)と異なるのでここで明示的に上書き
        measurement: sensor_data
        tags: { device_id: "abc123" }
        time_range: 5m
        expect:
          exists: true
          fields: { temperature: 23.5 }
